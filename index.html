
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ghastly Raven Graphics</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0a0a0a;
            color: #e2e8f0;
        }
        h1, h2, h3, h4, .font-gothic {
            font-family: 'Cinzel', serif;
        }
        .text-accent {
            color: #9333ea;
        }
        .bg-accent {
            background-color: #9333ea;
        }
        .border-accent {
            border-color: #9333ea;
        }
        .gothic-gradient {
            background: linear-gradient(135deg, #1a0033 0%, #000000 100%);
        }
        .movie-reel-track {
            display: flex;
            width: calc(250px * 20);
            animation: scroll 40s linear infinite;
        }
        @keyframes scroll {
            0% { transform: translateX(0); }
            100% { transform: translateX(calc(-250px * 10)); }
        }
        .movie-reel-track:hover {
            animation-play-state: paused;
        }
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #000;
        }
        ::-webkit-scrollbar-thumb {
            background: #4c1d95;
            border-radius: 4px;
        }
    </style>
